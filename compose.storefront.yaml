services:
  frontend:
    build:
      context: storefront/
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=pk_b52f1cc6fa2b09c6654506d53e63112fca28484818bcff817c7568d91e35bd2f
    ports:
      - 8000:8000
    extra_hosts:
      - "https://medusa-backend-2-6-1-latest.onrender.com:host-gateway"
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 1024M
    volumes:
      - storefront-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - medusa-net  

volumes:
  storefront-data:

networks:
  medusa-net:
      name: medusa-net  
