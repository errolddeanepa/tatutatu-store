services:
  frontend:
    build:
      context: storefront/
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=pk_b52f1cc6fa2b09c6654506d53e63112fca28484818bcff817c7568d91e35bd2f
    ports:
      - 10000:10000
    environment:
      NEXT_PUBLIC_ADMIN_URL: "https://medusa-backend-2-6-1-latest.onrender.com"
      NEXT_PUBLIC_ADMIN_PORT: "9000"
    expose:
      - "9000"
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 1024M
    volumes:
      - storefront-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - medusa-net  

volumes:
  storefront-data:

networks:
  medusa-net:
      name: medusa-net  
